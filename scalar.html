<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Scalar" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0c0d0f" />
<meta name="format-detection" content="telephone=no" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Scalar — Engineering Units</title>

<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%230c0d0f'/><path d='M42 132 L90 48 L138 132 Z' fill='none' stroke='%23e8b657' stroke-width='9' stroke-linejoin='round' stroke-linecap='round'/><circle cx='90' cy='108' r='5' fill='%23e8b657'/></svg>" />
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%230c0d0f'/><path d='M42 132 L90 48 L138 132 Z' fill='none' stroke='%23e8b657' stroke-width='9' stroke-linejoin='round'/></svg>" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="scalar.css?v=1.2.33">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="app">

  <header class="header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 20 L12 4 L21 20 Z" stroke="#e8b657" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="16" r="1.2" fill="#e8b657"/></svg>
      </div>
      <div class="brand-text">
        <h1>Scalar</h1>
        <p>engineering units · <button type="button" class="version" onclick="location.reload()">v1.2.33 ↻</button></p>
      </div>
    </div>
    <div class="precision" role="group" aria-label="Precision">
      <span class="precision-label">prec</span>
      <button class="precision-btn" data-prec="4">4</button>
      <button class="precision-btn active" data-prec="6">6</button>
      <button class="precision-btn" data-prec="8">8</button>
    </div>
  </header>

  <div class="searchbar">
    <input id="searchInput" class="search" type="search" inputmode="search" placeholder="Search calculators…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search calculators" />
    <button id="shareBtn" class="iconbtn" type="button" aria-label="Share link" title="Share link">⤴</button>
  </div>
  <nav class="cat-groups" id="catGroups" aria-label="Category groups"></nav>
  <nav class="categories" id="categories" aria-label="Unit categories"></nav>

  <section class="conversion" id="convPanel">
    <div class="card" id="fromCard">
      <div class="card-head">
        <span class="card-label">from</span>
        <label class="unit-picker">
          <span class="sym" id="fromSym">—</span>
          <svg class="caret" viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5 L6 8 L9.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <select id="fromUnit" aria-label="From unit"></select>
        </label>
      </div>
      <div class="value-row">
        <input
          class="value-input"
          id="fromValue"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          value="1"
          aria-label="From value"
        />
      </div>
      <div class="unit-full" id="fromName"></div>
    </div>

    <div class="swap-container">
      <button class="swap-btn" id="swapBtn" aria-label="Swap units">
        <svg viewBox="0 0 24 24" fill="none"><path d="M7 4 V20 M7 4 L3 8 M7 4 L11 8 M17 20 V4 M17 20 L13 16 M17 20 L21 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="card" id="toCard">
      <div class="card-head">
        <span class="card-label">to</span>
        <label class="unit-picker">
          <span class="sym" id="toSym">—</span>
          <svg class="caret" viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5 L6 8 L9.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <select id="toUnit" aria-label="To unit"></select>
        </label>
      </div>
      <div class="value-row">
        <div class="value-display" id="toValue" title="Tap to copy">—</div>
      </div>
      <div class="unit-full" id="toName"></div>
    </div>
  </section>

  <div class="relation" id="relation" role="button" tabindex="0" aria-label="Swap units">—</div>

  <!-- ===== MOTOR LRC / INRUSH CALCULATOR (mode: 'motor') ===== -->
  <section class="motor" id="motorPanel" hidden>

    <div class="card motor-card">
      <div class="card-label">motor nameplate</div>
      <div class="m-grid">
        <label class="m-field">
          <span>HP</span>
          <input id="mHP" inputmode="decimal" autocomplete="off" placeholder="75" />
        </label>
        <label class="m-field">
          <span>Voltage</span>
          <input id="mV" inputmode="decimal" autocomplete="off" placeholder="460" />
        </label>
        <label class="m-field">
          <span>Phase</span>
          <span class="m-select">
            <select id="mPhase">
              <option value="3">3-phase</option>
              <option value="1">1-phase</option>
            </select>
          </span>
        </label>
        <label class="m-field">
          <span>Code letter</span>
          <span class="m-select">
            <select id="mCode"></select>
          </span>
        </label>
        <label class="m-field">
          <span>Efficiency %</span>
          <input id="mEff" inputmode="decimal" autocomplete="off" placeholder="93" />
        </label>
        <label class="m-field">
          <span>Power factor</span>
          <input id="mPF" inputmode="decimal" autocomplete="off" placeholder="0.86" />
        </label>
      </div>

      <div class="m-fla">
        <span class="card-label">full-load amps · FLA</span>
        <div class="value-row">
          <input class="value-input" id="mFLA" type="text" inputmode="decimal"
                 autocomplete="off" autocorrect="off" spellcheck="false" placeholder="80" aria-label="Full-load amps" />
          <span class="m-fla-unit">A</span>
        </div>
        <div class="m-note" id="mFlaNote">Leave blank to estimate from HP, voltage, efficiency & PF.</div>
      </div>
    </div>

    <div class="card motor-card">
      <div class="card-label">starting inrush · locked-rotor current</div>
      <div class="m-results" id="mResults"></div>
    </div>

    <div class="card motor-card">
      <div class="card-label">voltage dip at start</div>
      <div class="m-grid m-grid-2">
        <label class="m-field">
          <span>Transformer kVA</span>
          <input id="mXfmr" inputmode="decimal" autocomplete="off" placeholder="500" />
        </label>
        <label class="m-field">
          <span>Impedance %Z</span>
          <input id="mZ" inputmode="decimal" autocomplete="off" placeholder="5.75" />
        </label>
      </div>
      <div class="m-dip" id="mDip">—</div>
    </div>

  </section>

  <!-- ===== GENERIC CALCULATOR PANEL (mode: 'calc') ===== -->
  <section class="motor" id="calcPanel" hidden>
    <div class="card motor-card">
      <div class="card-label" id="calcInputsLabel">inputs</div>
      <div class="m-models" id="calcModels" hidden></div>
      <div class="m-grid" id="calcInputs"></div>
    </div>
    <div class="card motor-card" id="calcVisualCard" hidden>
      <div class="card-label">diagram</div>
      <div class="calc-visual" id="calcVisual"></div>
    </div>
    <div class="card motor-card">
      <div class="card-label">result</div>
      <div class="m-results" id="calcResults"></div>
      <div class="m-note" id="calcNote" hidden></div>
    </div>
  </section>

</div>

<div class="toast" id="toast">copied</div>

<script src="categories.js?v=1.2.33"></script>
<script src="app.js?v=1.2.33"></script>
</body>
</html>
